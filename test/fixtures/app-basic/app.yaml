pages:
  "/":
    title: Trips
    filters:
      month: { default: "2026-08" }
    sections:
      - StatCard: { label: This month, value: data#monthlyTotal }
      - Table:
          rows: data#trips
          columns: [date, km]
          empty: No trips yet
  "/trip/:id":
    title: Trip
    sections:
      - StatCard: { label: Trip, value: params.id }
